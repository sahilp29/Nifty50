<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nifty50 · News</title>
<style>
:root{--bg:#07090d;--s1:#0b0f17;--s2:#101620;--bd:#1a2636;--text:#bfcfdf;--muted:#4a6480;--up:#22c55e;--acc:#38bdf8;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;min-height:100vh;overflow-x:hidden}
.hdr{background:rgba(7,9,13,.96);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:200}
.hdr-in{max-width:900px;margin:0 auto;padding:0 16px;height:54px;display:flex;align-items:center;gap:14px}
.logo{font-weight:800;font-size:18px;color:#fff}.logo em{color:var(--up);font-style:normal}
.ttl{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.hdr-r{margin-left:auto;display:flex;gap:8px}
.btn{background:var(--s2);border:1px solid var(--bd);color:var(--text);padding:6px 13px;border-radius:7px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-decoration:none}
.btn:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:620px;margin:0 auto;padding:16px}
.note{color:var(--muted);font-size:11px;margin-top:12px;text-align:center}
.note a{color:var(--acc)}
@media(max-width:520px){.ttl{display:none}}
</style>
</head>
<body>
<header class="hdr"><div class="hdr-in">
  <div class="logo">Nifty<em>50</em></div>
  <div class="ttl">Market News</div>
  <div class="hdr-r">
    <a class="btn" href="/index.html">⌂ HOME</a>
    <a class="btn" href="/impact.html">⚡ Impact Calc</a>
  </div>
</div></header>
<main>
  <div id="feed">
    <a class="twitter-timeline" data-theme="dark" data-height="1400" data-dnt="true" data-chrome="noheader nofooter transparent" href="https://twitter.com/REDBOXINDIA?ref_src=twsrc%5Etfw">Posts by REDBOXINDIA</a>
  </div>
  <div class="note" id="fb" style="display:none">
    Feed couldn't load here (X blocks embeds in some browsers or when not logged in).<br><br>
    <a class="btn" href="https://x.com/REDBOXINDIA" target="_blank" rel="noopener">Open @REDBOXINDIA on X ↗</a>
  </div>
  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
  <script>
    // If X's widget hasn't drawn an iframe after 7s, show the fallback button
    setTimeout(function(){
      if(!document.querySelector('#feed iframe')){ document.getElementById('fb').style.display='block'; }
    }, 7000);
  </script>
</main>
</body>
</html>
