<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nifty50 · News</title>
<style>
:root{--bg:#07090d;--s1:#0b0f17;--s2:#101620;--bd:#1a2636;--text:#bfcfdf;--muted:#4a6480;--up:#22c55e;--acc:#38bdf8;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;display:flex;flex-direction:column;overflow-x:hidden}
.hdr{background:rgba(7,9,13,.96);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:200}
.hdr-in{max-width:1100px;margin:0 auto;padding:0 16px;height:54px;display:flex;align-items:center;gap:14px}
.logo{font-weight:800;font-size:18px;color:#fff}.logo em{color:var(--up);font-style:normal}
.ttl{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.hdr-r{margin-left:auto;display:flex;gap:8px}
.btn{background:var(--s2);border:1px solid var(--bd);color:var(--text);padding:6px 13px;border-radius:7px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.bar{max-width:1100px;width:100%;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px}
.bar .src{margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;max-width:1100px;width:100%;margin:0 auto;padding:0 16px 16px;display:flex}
/* ▼ Hides CNBC's bottom nav + ad strip. Top is handled by jumping to the Live Updates section (LIVE_ANCHOR below). */
:root{--crop-top:0px;--crop-bottom:125px}
.frame{flex:1;position:relative;height:calc(100vh - 130px);min-height:420px;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:#fff}
iframe{position:absolute;left:0;top:calc(-1 * var(--crop-top));width:100%;height:calc(100% + var(--crop-top) + var(--crop-bottom));border:0;display:block}
@media(max-width:520px){.ttl{display:none}.hdr-r .btn{padding:6px 9px}}
</style>
</head>
<body>
<header class="hdr"><div class="hdr-in">
  <div class="logo">Nifty<em>50</em></div>
  <div class="ttl">Market News</div>
  <div class="hdr-r">
    <a class="btn" href="/index.html">⌂ HOME</a>
    <a class="btn" href="/impact.html">⚡ Impact Calc</a>
  </div>
</div></header>

<div class="bar">
  <span class="src">CNBC-TV18 · Live · <span id="ago">auto-refresh 30s</span></span>
  <button class="btn" onclick="reloadFeed()">↻ Refresh</button>
  <a class="btn" id="open" target="_blank" rel="noopener">Open ↗</a>
</div>

<main>
  <div class="frame"><iframe id="feed" title="CNBC-TV18 live market blog" loading="lazy"></iframe></div>
</main>

<script>
  // Today's live blog link is found automatically by /api/liveblog.
  // ▼ Backup only: used if the auto-lookup fails. You can leave this as is.
  const FALLBACK_URL = "https://www.cnbctv18.com/market/stock-market-live-updates-nifty-50-expiry-today-sensex-hdfc-icici-axis-hospitals-divis-omc-sugar-stocks-vedanta-share-price-liveblog-20014552.htm/amp";

  // ▼ The id of CNBC's live updates list. The frame jumps straight there on every load.
  const LIVE_ANCHOR = "scroll-into-view";

  const REFRESH_MS = 30000;      // reload the feed every 30s
  const PAUSE_MS   = 60000;      // after you tap into the feed, wait 60s before reloading
  const LOOKUP_MS  = 5 * 60000;  // re-check for a new day's blog every 5 min

  const feed = document.getElementById('feed');
  const ago  = document.getElementById('ago');
  const open = document.getElementById('open');
  let liveUrl = null, lastLoad = Date.now(), lastTouch = 0;

  const withAnchor = u => u + (LIVE_ANCHOR ? '#' + LIVE_ANCHOR : '');
  function buildSrc(){
    const bust = (liveUrl.includes('?') ? '&' : '?') + 't=' + Date.now();
    return withAnchor(liveUrl + bust);
  }
  function reloadFeed(){ if (!liveUrl) return; feed.src = buildSrc(); lastLoad = Date.now(); }

  async function lookup(){
    let url = null;
    try {
      const r = await fetch('/api/liveblog', { cache: 'no-store' });
      const j = await r.json();
      if (j && j.ok && j.url) url = j.url;
    } catch (e) {}
    url = url || liveUrl || FALLBACK_URL;
    if (url !== liveUrl) {           // first load, or CNBC started a new day's blog
      liveUrl = url;
      open.href = withAnchor(liveUrl);
      reloadFeed();
    }
  }

  lookup();
  setInterval(lookup, LOOKUP_MS);

  // Tapping into the iframe moves focus to it -> treat that as "reading", pause reloads
  window.addEventListener('blur', () => { if (document.activeElement === feed) lastTouch = Date.now(); });

  setInterval(() => {
    const now = Date.now();
    const reading = now - lastTouch < PAUSE_MS;
    if (!document.hidden && !reading && now - lastLoad >= REFRESH_MS) {
      if (document.activeElement === feed) feed.blur();
      reloadFeed();
    }
    ago.textContent = !liveUrl ? 'finding today\'s blog…'
      : reading ? 'paused while reading'
      : 'updated ' + Math.round((now - lastLoad) / 1000) + 's ago';
  }, 1000);
</script>
</body>
</html>
